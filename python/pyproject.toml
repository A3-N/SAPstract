[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sapstract"
version = "0.2.0"
description = "Dependency-free Python reader, writer, validator, and inspector for SAP SSFS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SSFS interoperability contributors" }]
keywords = ["SAP", "SSFS", "rsecssfx", "Cloud Connector", "interoperability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "twine>=5,<7",
]

[project.scripts]
sapstract = "sapstract.cli:main"

[project.urls]
Homepage = "https://github.com/A3-N/SAPstract"
Repository = "https://github.com/A3-N/SAPstract"
Issues = "https://github.com/A3-N/SAPstract/issues"
Documentation = "https://github.com/A3-N/SAPstract/tree/main/python/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sapstract*"]
namespaces = false

[tool.setuptools.package-data]
sapstract = ["py.typed"]
